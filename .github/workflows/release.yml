# Compile NumFranc pour toutes les plateformes et publie un zip à chaque version (tag v*).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Droits minimaux par défaut (lecture seule) ; seul le job « package » peut publier.
# Les actions sont épinglées par leur empreinte (SHA) : une étiquette comme « v4 » peut être
# déplacée par quelqu'un d'autre, une empreinte non.
permissions:
  contents: read

# bash avec « -eo pipefail » : une erreur au milieu d'une suite de commandes arrête tout.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo test --release

  build:
    needs: test
    strategy:
      matrix:
        include:
          # Linux : version « normale » (glibc), seule capable de charger l'affichage (Wayland, X11).
          # Compilée sur Ubuntu 22.04 pour fonctionner aussi sur les distributions un peu anciennes.
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,   name: numfranc-linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu,  name: numfranc-linux-aarch64 }
          - { os: macos-14,         target: aarch64-apple-darwin,       name: numfranc-macos-arm64 }
          - { os: macos-14,         target: x86_64-apple-darwin,        name: numfranc-macos-x86_64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     name: numfranc-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add ${{ matrix.target }}
      # Compilation reproductible (même version de Rust, chemins neutres) : voir scripts/build-reproductible.sh
      - shell: bash
        run: ./scripts/build-reproductible.sh ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir -p dist-bin
          src=target/${{ matrix.target }}/release/numfranc
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "dist-bin/${{ matrix.name }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "${{ matrix.name }}", path: dist-bin/ }

  # Preuve de reproductibilité : on compile deux fois le programme Linux, dans deux dossiers
  # différents, et on exige exactement la même empreinte. Sinon, la version n'est pas publiée.
  reproductible:
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      empreinte: ${{ steps.compare.outputs.empreinte }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: ./scripts/build-reproductible.sh x86_64-unknown-linux-gnu | tail -1 | cut -d' ' -f1 > /tmp/premier.txt
      - run: |
          cp -r "$GITHUB_WORKSPACE" /tmp/autre-dossier && cd /tmp/autre-dossier && rm -rf target
          ./scripts/build-reproductible.sh x86_64-unknown-linux-gnu | tail -1 | cut -d' ' -f1 > /tmp/second.txt
      - id: compare
        run: |
          echo "1re compilation : $(cat /tmp/premier.txt)"; echo "2e compilation  : $(cat /tmp/second.txt)"
          cmp /tmp/premier.txt /tmp/second.txt
          echo "Reproductible : les deux empreintes sont identiques."
          echo "empreinte=$(cat /tmp/premier.txt)" >> "$GITHUB_OUTPUT"

  # Installeurs « double-clic » : un disque .dmg pour Mac, un installeur .exe pour Windows.
  # Si l'un d'eux échoue, la version est quand même publiée (sans lui) : regarde alors les avertissements.
  installeur-mac:
    needs: build
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist-bin, pattern: "numfranc-macos-*", merge-multiple: true }
      - run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p dist-installeurs
          ./packaging/outils-installeurs/macos-dmg.sh "$VERSION" dist-bin/numfranc-macos-arm64 dist-bin/numfranc-macos-x86_64 dist-installeurs/NumFranc-macos.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: installeur-mac, path: dist-installeurs/ }

  installeur-windows:
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist-bin, pattern: "numfranc-windows-*", merge-multiple: true }
      - run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          MAKENSIS="$(command -v makensis || true)"
          if [ -z "$MAKENSIS" ]; then
            choco install nsis -y --no-progress
            MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          fi
          mkdir -p dist-installeurs
          PY="$(command -v python3 || command -v python)"
          "$PY" packaging/outils-installeurs/make-icns.py ico assets/logo-256.png dist-installeurs/numfranc.ico
          "$MAKENSIS" -V2 -DVERSION="$VERSION" \
            -DPROGRAMME="$(cygpath -w "$PWD/dist-bin/numfranc-windows-x86_64.exe")" \
            -DICONE="$(cygpath -w "$PWD/dist-installeurs/numfranc.ico")" \
            -DSORTIE="$(cygpath -w "$PWD/dist-installeurs/NumFranc-windows-installation.exe")" \
            "$(cygpath -w "$PWD/packaging/outils-installeurs/windows.nsi")"
          rm dist-installeurs/numfranc.ico
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: installeur-windows, path: dist-installeurs/ }

  package:
    needs: [build, reproductible, installeur-mac, installeur-windows]
    # Les installeurs sont facultatifs (continue-on-error) : on publie même si l'un d'eux a échoué.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.reproductible.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist-bin, merge-multiple: true }
      # Le programme Linux publié doit être exactement celui des deux compilations de contrôle.
      - run: |
          publie="$(python3 -c "import hashlib,sys; print(hashlib.sha3_512(open(sys.argv[1],'rb').read()).hexdigest())" dist-bin/numfranc-linux-x86_64)"
          echo "publié    : $publie"; echo "contrôle  : ${{ needs.reproductible.outputs.empreinte }}"
          test "$publie" = "${{ needs.reproductible.outputs.empreinte }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true   # aucun installeur reçu (échec des jobs ci-dessus) : on publie quand même
        with: { path: dist-installeurs, pattern: "installeur-*", merge-multiple: true }
      # Paquets Linux (.deb) : double-clic dans le gestionnaire de fichiers.
      - run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p dist-installeurs
          ./packaging/outils-installeurs/linux-deb.sh "$VERSION" amd64 dist-bin/numfranc-linux-x86_64  dist-installeurs/NumFranc-linux-amd64.deb
          ./packaging/outils-installeurs/linux-deb.sh "$VERSION" arm64 dist-bin/numfranc-linux-aarch64 dist-installeurs/NumFranc-linux-arm64.deb
          for f in NumFranc-macos.dmg NumFranc-windows-installation.exe; do
            [ -f "dist-installeurs/$f" ] || echo "::warning::Installeur absent de cette version : $f (voir les jobs installeur-mac / installeur-windows)"
          done
          ls -l dist-installeurs
      - run: chmod +x dist-bin/* && ./scripts/make-dist.sh dist && cd dist && zip -r NumFranc.zip NumFranc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: NumFranc, path: dist/NumFranc.zip }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with: { files: "dist/NumFranc.zip\ndist/NumFranc/SHA3SUMS.txt\ndist-installeurs/*" }
