# Compile NumFranc pour toutes les plateformes et publie un zip à chaque version (tag v*).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  name: numfranc-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: numfranc-linux-aarch64 }
          - { os: macos-14,         target: aarch64-apple-darwin,       name: numfranc-macos-arm64 }
          - { os: macos-14,         target: x86_64-apple-darwin,        name: numfranc-macos-x86_64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     name: numfranc-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir -p dist-bin
          src=target/${{ matrix.target }}/release/numfranc
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "dist-bin/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: dist-bin/ }

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist-bin, merge-multiple: true }
      - run: chmod +x dist-bin/* && ./scripts/make-dist.sh dist && cd dist && zip -r NumFranc.zip NumFranc
      - uses: actions/upload-artifact@v4
        with: { name: NumFranc, path: dist/NumFranc.zip }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "dist/NumFranc.zip\ndist/NumFranc/SHA3SUMS.txt" }
