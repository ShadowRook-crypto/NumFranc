[package]
name = "numfranc"
version = "1.3.1"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fips204 = "0.4.6"
fips205 = { version = "0.4", default-features = false, features = ["default-rng", "slh_dsa_shake_128s"] }
getrandom = "0.2"
igd-next = { version = "0.18.0", default-features = false, features = ["io_sync"] }
mainline = "8"
num-bigint = "0.5.1"
qrcode = { version = "0.14", default-features = false }
rpassword = { version = "7", default-features = false }
sha3 = "0.12.0"
socket2 = { version = "0.5", features = ["all"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# macOS : recevoir les liens nfr:… (Apple Events). Mêmes versions que celles déjà tirées par eframe.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventManager", "NSAppleEventDescriptor", "NSString"] }

[profile.release]
# Une seule unité de compilation : un programme un peu plus rapide, et un résultat plus stable d'une machine à l'autre.
codegen-units = 1
